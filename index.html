<form action="https://formspree.io/f/mqazqazl" method="POST" class="space-y-8 bg-stone-950 border border-stone-800 rounded-3xl p-10 shadow-2xl">

    <input type="hidden" name="_to" value="ecuhjelpen@gmail.com">

    <!-- NAVN -->
    <div>
        <label class="block text-sm font-semibold text-stone-300 mb-2">Ditt navn:</label>
        <input type="text" name="name" required class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3">
    </div>

    <!-- BIL INFO -->
    <div>
        <label class="block text-sm font-semibold text-stone-300 mb-2">Regnr (viktig):</label>
        <input type="text" name="regnr" required class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3">
    </div>

    <div>
        <label class="block text-sm font-semibold text-stone-300 mb-2">Bil (merke, modell, motor, årsmodell):</label>
        <input type="text" name="car_info" required class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3" placeholder="Eks: BMW 320d 2.0 2016">
    </div>

    <!-- KEYLESS -->
    <div class="grid md:grid-cols-2 gap-6">

        <div>
            <label class="block text-sm font-semibold text-stone-300 mb-2">Keyless start:</label>
            <select name="keyless_start" required class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3">
                <option value="" disabled selected>Velg...</option>
                <option value="ja">Ja</option>
                <option value="nei">Nei</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-stone-300 mb-2">Keyless entry (dører):</label>
            <select name="keyless_entry" required class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3">
                <option value="" disabled selected>Velg...</option>
                <option value="ja">Ja</option>
                <option value="nei">Nei</option>
            </select>
        </div>

    </div>

    <!-- FCC ID -->
    <div>
        <label class="block text-sm font-semibold text-stone-300 mb-2">FCC ID (valgfritt – står ofte inni nøkkel):</label>
        <input type="text" name="fcc_id" class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3" placeholder="Eks: N5F-A04TAA">
    </div>

    <!-- TYPE JOBB -->
    <div>
        <label class="block text-sm font-semibold text-stone-300 mb-2">Hva gjelder saken?</label>
        <select name="request_type" required class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3">
            <option value="" disabled selected>Velg...</option>
            <option value="ekstranokkel">Ekstra nøkkel</option>
            <option value="mistet_nokkel">Mistet alle nøkler</option>
            <option value="programmering">Nøkkelprogrammering</option>
            <option value="diagnose">Diagnose / feilsøking</option>
            <option value="ecu_tcu">ECU / TCU jobb</option>
            <option value="annet">Annet</option>
        </select>
    </div>

    <!-- BESKRIVELSE -->
    <div>
        <label class="block text-sm font-semibold text-stone-300 mb-2">Beskrivelse:</label>
        <textarea name="message" rows="6" class="w-full bg-stone-900 border border-stone-800 text-stone-50 rounded-lg px-4 py-3"
        placeholder="Beskriv problemet så detaljert som mulig..."></textarea>
    </div>

    <!-- SUBMIT -->
    <button type="submit" class="w-full inline-flex items-center justify-center gap-3 bg-emerald-600 text-stone-950 font-bold px-12 py-5 rounded-xl text-lg hover:bg-emerald-500 transition-colors shadow-xl">
        Send forespørsel
    </button>

</form>
